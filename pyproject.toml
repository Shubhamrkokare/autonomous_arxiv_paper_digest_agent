[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autonomous-arxiv-digest"
version = "0.1.0"
description = "A local, stateful arXiv paper digest and grounded QA agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Shubham Kokare" },
]
dependencies = [
  "arxiv>=2.1.3",
  "chromadb>=0.5.23",
  "httpx>=0.27.2",
  "langgraph>=0.2.60",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.1",
  "pymupdf>=1.25.1",
  "sentence-transformers>=3.3.1",
  "typer>=0.15.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "ruff>=0.8.4",
]

[project.scripts]
arxiv-digest = "arxiv_digest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
